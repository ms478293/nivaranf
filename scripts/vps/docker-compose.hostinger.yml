services:
  nivaran-web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.nivaranfoundation.org}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://www.nivaranfoundation.org}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.nivaranfoundation.org}
        AUTH_API_BASE_URL: ${AUTH_API_BASE_URL:-https://api.nivaranfoundation.org}
        NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS: ${NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS:-false}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SQUARE_APP_ID: ${NEXT_PUBLIC_SQUARE_APP_ID:-}
        NEXT_PUBLIC_SQUARE_LOCATION_ID: ${NEXT_PUBLIC_SQUARE_LOCATION_ID:-}
    restart: unless-stopped
    env_file:
      - /etc/nivaran/web.env
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.nivaran-web.rule=Host(`nivaranfoundation.org`) || Host(`www.nivaranfoundation.org`) || Host(`global.nivaranfoundation.org`) || Host(`usa.nivaranfoundation.org`)
      - traefik.http.routers.nivaran-web.entrypoints=web,websecure
      - traefik.http.routers.nivaran-web.tls=true
      - traefik.http.routers.nivaran-web.tls.certresolver=mytlschallenge
      - traefik.http.services.nivaran-web.loadbalancer.server.port=3000
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: n8n_default
